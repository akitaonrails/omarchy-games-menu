[package]
name = "ogm-net"
version = "0.1.0"
edition.workspace = true

[dependencies]
ogm-core = { path = "../ogm-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
