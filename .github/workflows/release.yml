name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sanity gate: never cut a release from a tree that doesn't pass tests.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble binary tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          STAGE="omarchy-games-menu-${VERSION}"
          mkdir -p "$STAGE"
          cp target/release/ogm games-menu README.md LICENSE "$STAGE/"
          cp packaging/omarchy-games-menu.desktop "$STAGE/"
          cp -r qml "$STAGE/qml"
          tar -czf "${STAGE}-x86_64.tar.gz" -C "$STAGE" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          NOTES="releases/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

      - name: Upload binary tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "omarchy-games-menu-${TAG#v}-x86_64.tar.gz" --clobber

  # GITHUB_TOKEN-created releases don't fire the `release` trigger, so call
  # the AUR workflow explicitly once the release exists.
  aur:
    needs: release
    uses: ./.github/workflows/aur-publish.yml
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
