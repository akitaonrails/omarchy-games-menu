name: AUR Publish

on:
  release:
    types: [published]
  # Called from release.yml after the GitHub release exists. Needed because a
  # release created with GITHUB_TOKEN does not fire the `release` trigger.
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout packaging template
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          sparse-checkout: packaging

      - name: Download source tarball and compute SHA256
        id: checksum
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          URL="https://github.com/akitaonrails/omarchy-games-menu/archive/refs/tags/${TAG}.tar.gz"
          echo "Downloading ${URL}..."
          curl -fSL -o source.tar.gz "${URL}"
          SHA256=$(sha256sum source.tar.gz | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "SHA256: ${SHA256}"

      - name: Generate PKGBUILD
        run: |
          cp packaging/PKGBUILD ./PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${{ steps.checksum.outputs.sha256 }}')/" PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: omarchy-games-menu
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.version }}"
          ssh_keyscan_types: ed25519
