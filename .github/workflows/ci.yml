name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ubuntu-latest
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88
      - name: Check minimum Rust version
        run: cargo check --workspace --all-targets --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - name: Audit dependencies and yanked crates
        run: cargo audit

  machete:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cargo-machete
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-machete
      - name: Check unused dependencies
        run: cargo machete

  # Builds the package the same way the AUR PKGBUILD does, but from the PR's
  # checkout instead of a published tag tarball, so packaging breakage shows
  # up before a release.
  pkgbuild:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tooling
        # quickshell is the package's only runtime dep; installing it as root
        # here lets makepkg run as the unprivileged builder without --syncdeps
        # (sudo in this container has no passwordless path).
        run: pacman -Syu --noconfirm --needed base-devel git cargo rust cmake namcap quickshell

      - name: Lint QML
        run: /usr/lib/qt6/bin/qmllint -I /usr/lib/qt6/qml qml/*.qml

      - name: Build package from local source
        run: |
          set -eu
          useradd -m builder
          REPO="$PWD"
          WORK=/home/builder/pkg
          mkdir -p "$WORK"
          cp packaging/PKGBUILD "$WORK/PKGBUILD"
          cd "$REPO"
          tar czf "$WORK/omarchy-games-menu-0.0.0.tar.gz" \
            --exclude=.git --exclude=target \
            --transform "s,^\.,omarchy-games-menu-0.0.0," .
          cd "$WORK"
          sed -i 's/^pkgver=.*/pkgver=0.0.0/' PKGBUILD
          sed -i 's|^source=.*|source=("omarchy-games-menu-0.0.0.tar.gz")|' PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('$(sha256sum omarchy-games-menu-0.0.0.tar.gz | awk '{print $1}')')/" PKGBUILD
          chown -R builder:builder "$WORK"
          sudo -u builder makepkg --noconfirm --clean
          namcap PKGBUILD || true
          namcap omarchy-games-menu-0.0.0-1-x86_64.pkg.tar.zst || true
