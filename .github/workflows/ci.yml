name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ubuntu-latest
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # Builds the package the same way the AUR PKGBUILD does, but from the PR's
  # checkout instead of a published tag tarball, so packaging breakage shows
  # up before a release.
  pkgbuild:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tooling
        run: pacman -Syu --noconfirm --needed base-devel git cargo rust namcap

      - name: Build package from local source
        run: |
          set -eu
          useradd -m builder
          REPO="$PWD"
          WORK=/home/builder/pkg
          mkdir -p "$WORK"
          cp packaging/PKGBUILD "$WORK/PKGBUILD"
          cd "$REPO"
          tar czf "$WORK/omarchy-games-menu-0.0.0.tar.gz" \
            --exclude=.git --exclude=target \
            --transform "s,^\.,omarchy-games-menu-0.0.0," .
          cd "$WORK"
          sed -i 's/^pkgver=.*/pkgver=0.0.0/' PKGBUILD
          sed -i 's|^source=.*|source=("omarchy-games-menu-0.0.0.tar.gz")|' PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('$(sha256sum omarchy-games-menu-0.0.0.tar.gz | awk '{print $1}')')/" PKGBUILD
          chown -R builder:builder "$WORK"
          sudo -u builder makepkg --noconfirm --syncdeps --clean
          namcap PKGBUILD || true
          namcap omarchy-games-menu-0.0.0-1-x86_64.pkg.tar.zst || true
